apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-apps
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - repoURL: https://github.com/Shandoo94/cluster-kube-taurus-iaas.git
                  revision: master
                  repoPath: apps/*/*
          - git:
              repoURL: "{{ repoURL }}"
              revision: "{{ revision }}"
              directories:
                - path: "{{ repoPath }}"
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{ path[1] }}-{{ path.basenameNormalized }}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: "{{ repoURL }}"
        targetRevision: "{{ revision }}"
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ path[1] }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          prune: true
