- name: Maintain node state (Day-2 operations)
  hosts: k8s_nodes
  gather_facts: true
  become: true

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ node_hostname }}"
      tags:
        - hostname

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
      tags:
        - packages

    - name: Ensure host packages are installed
      ansible.builtin.apt:
        name: "{{ host_packages }}"
        state: present
      tags:
        - packages

    - name: Ensure kube-admin has passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-cloud-init-users
        line: "{{ kube_admin_user }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"
      tags:
        - user

    - name: Ensure SSH authorized key for kube-admin
      ansible.posix.authorized_key:
        user: "{{ kube_admin_user }}"
        key: "{{ ssh_authorized_key }}"
        state: present
        exclusive: false
      tags:
        - ssh

    - name: Set multipath conf
      ansible.builtin.blockinfile:
        path: /etc/multipath.conf
        marker: "# {mark} ANSIBLE MANAGED - Longhorn blacklist"
        block: |
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
        create: true
        mode: "0644"
      notify: restart multipathd
      tags:
        - multipath

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"
      tags:
        - system

    - name: Set locale
      community.general.locale_gen:
        name: "{{ locale }}"
        state: present
      tags:
        - system

    - name: Increase fs.inotify limits for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-k8s-inotify.conf
      loop:
        - { name: "fs.inotify.max_user_instances", value: "8192" }
        - { name: "fs.inotify.max_user_watches", value: "524288" }
      tags:
        - system

  handlers:
    - name: restart multipathd
      ansible.builtin.systemd:
        name: multipathd
        state: restarted
      failed_when: false
