fullnameOverride: loki

deploymentMode: SimpleScalable

loki:
  commonConfig:
    replication_factor: 2
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 4
  query_scheduler:
    use_scheduler_ring: true

gateway:
  affinity: null # Allow scheduling on single-node cluster by removing hard anti-affinity

backend:
  replicas: 2
  persistence:
    storageClass: longhorn-1-replica
    size: 10Gi
  affinity: null # Allow scheduling on single-node cluster by removing hard anti-affinity
read:
  replicas: 2
  affinity: null # Allow scheduling on single-node cluster by removing hard anti-affinity
write:
  replicas: 2
  persistence:
    storageClass: longhorn-1-replica
    size: 10Gi
  affinity: null # Allow scheduling on single-node cluster by removing hard anti-affinity

minio:
  enabled: true
  persistence:
    storageClass: longhorn-1-replica
