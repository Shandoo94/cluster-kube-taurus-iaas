apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: step-ca-tls
  namespace: pki
spec:
  secretName: step-ca-tls
  issuerRef:
    name: step-issuer
    kind: StepClusterIssuer
    group: certmanager.step.sm
  dnsNames:
    - step.taurus.kube.internal
  privateKey:
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: step-ca
  namespace: pki
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`step.taurus.kube.internal`)
      priority: 10
      services:
        - name: step-certificates
          port: 443
  tls:
    secretName: step-ca-tls
